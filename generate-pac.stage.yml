# Stage: GeneratePAC
# Validates the proxy JSON and exclusions.config, generates proxy.pac and
# publishes it as the pipeline artifact 'pac'. Requires bash and jq on the agent
# (both preinstalled on Microsoft-hosted Ubuntu images).
stages:
- stage: GeneratePAC
  displayName: Generate PAC file
  variables:
    proxyConfigFile: 'config/proxies.json'
    exclusionsConfigFile: 'config/exclusions.config'
    pacOutputDirectory: '$(Build.ArtifactStagingDirectory)/pac'
    pacOutputFile: 'proxy.pac'

  jobs:
  - job: GeneratePAC
    displayName: Generate PAC file
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        fail() { echo "##vso[task.logissue type=error]$1"; exit 1; }

        [ -f "$PROXY_CONFIG_FILE" ] || fail "Proxy configuration file not found: $PROXY_CONFIG_FILE"
        [ -f "$EXCLUSIONS_CONFIG_FILE" ] || fail "Exclusions file not found: $EXCLUSIONS_CONFIG_FILE"
        jq -e 'type == "object"' "$PROXY_CONFIG_FILE" > /dev/null || fail "Proxy configuration is not a valid JSON object: $PROXY_CONFIG_FILE"

        # Validate active proxies. Messages name the entry index only, never field values.
        errors=$(jq -r '
          if (.proxies | type) != "array" then "\"proxies\" is missing or not an array"
          else .proxies | to_entries[] | select(.value.active == true) | .key as $i | .value
            | (select((.ip_address | type) != "string" or (.ip_address | test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}$") | not))
                | "proxies[\($i)].ip_address is missing or not an IPv4 address"),
              (select((.port | type) != "number" or .port != (.port | floor) or .port < 1 or .port > 65535)
                | "proxies[\($i)].port is missing or not an integer between 1 and 65535")
          end' "$PROXY_CONFIG_FILE")
        [ -z "$errors" ] || { sed 's/^/##vso[task.logissue type=error]/' <<< "$errors"; exit 1; }

        # Active proxies in JSON order = failover order. No DIRECT fallback.
        proxy_chain=$(jq -r '[.proxies[] | select(.active == true) | "PROXY \(.ip_address):\(.port)"] | join("; ")' "$PROXY_CONFIG_FILE")
        [ -n "$proxy_chain" ] || fail "No active proxies found. Refusing to generate a PAC that routes everything DIRECT."

        # Exclusions as a JSON array (valid JavaScript): trimmed, empty and '#' lines dropped,
        # quotes/backslashes escaped by jq, non-ASCII escaped by -a.
        exclusions=$(jq -a -R -s 'ltrimstr("﻿") | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
          | map(select(. != "" and (startswith("#") | not)))' "$EXCLUSIONS_CONFIG_FILE")

        echo "Proxy configuration loaded: $PROXY_CONFIG_FILE"
        echo "$(jq '.proxies | length' "$PROXY_CONFIG_FILE") proxy definitions found"
        echo "$(jq '[.proxies[] | select(.active == true)] | length' "$PROXY_CONFIG_FILE") active proxies selected: $proxy_chain"
        echo "$(jq 'length' <<< "$exclusions") exclusions loaded"

        mkdir -p "$PAC_OUTPUT_DIRECTORY"
        pac_file="$PAC_OUTPUT_DIRECTORY/$PAC_OUTPUT_FILE"
        cat > "$pac_file" <<EOF
        // ------------------------------------------------------------------
        // AUTO-GENERATED FILE
        // Do not modify manually.
        // Generated by Azure DevOps, build ${BUILD_BUILDNUMBER:-n/a}.
        // ------------------------------------------------------------------

        function FindProxyForURL(url, host) {

            var exclusions = $exclusions;

            for (var i = 0; i < exclusions.length; i++) {
                if (shExpMatch(host, exclusions[i]) || shExpMatch(url, exclusions[i])) {
                    return "DIRECT";
                }
            }

            return "$proxy_chain";
        }
        EOF

        echo "PAC generated successfully"
        echo "PAC location: $pac_file"
      displayName: Validate configuration and generate PAC
      env:
        PROXY_CONFIG_FILE: $(proxyConfigFile)
        EXCLUSIONS_CONFIG_FILE: $(exclusionsConfigFile)
        PAC_OUTPUT_DIRECTORY: $(pacOutputDirectory)
        PAC_OUTPUT_FILE: $(pacOutputFile)

    # On older Azure DevOps Server versions without pipeline artifacts,
    # use PublishBuildArtifacts@1 instead.
    - publish: $(pacOutputDirectory)
      artifact: pac
      displayName: Publish PAC artifact
